# Dev variant: live-mounts the repo and runs the dev server with hot reload.
# Usage: docker compose -f docker-compose.dev.yml up
services:
  web:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "3002:3002"
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
    env_file:
      - .env
    command: sh -c "npm install && npx prisma generate && npm run dev -- -p 3002"
